<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2c" />
      <stop offset="100%" stop-color="#003559" />
    </linearGradient>
    <linearGradient id="bulbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1daff7" />
      <stop offset="60%" stop-color="#0082b0" />
      <stop offset="100%" stop-color="#004574" />
    </linearGradient>
    <linearGradient id="filament" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f16108" />
      <stop offset="50%" stop-color="#f6af3c" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1daff7" stroke-opacity="0.3" stroke-width="1" />

  <!-- Lightbulb Glass Outline -->
  <path d="M32 10 C21.5 10 16 17.5 16 25 C16 31 19.5 35.5 22 39 L22 43 C22 44.1 22.9 45 24 45 L40 45 C41.1 45 42 44.1 42 43 L42 39 C44.5 35.5 48 31 48 25 C48 17.5 42.5 10 32 10 Z" 
        fill="url(#bulbGlow)" fill-opacity="0.18" 
        stroke="#1daff7" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Bulb Base / Screw Thread -->
  <path d="M25 48 L39 48 M26 51 L38 51 M28 54 L36 54" stroke="#aeb1b7" stroke-width="2" stroke-linecap="round" />
  <path d="M30 56 C30 57.1 30.9 58 32 58 C33.1 58 34 57.1 34 56 Z" fill="#0082b0" />

  <!-- Neural Net / AI Core Filament inside Lamp (T1 Brand Motif) -->
  <g filter="url(#glow)">
    <!-- Central AI Chip / Brain Node -->
    <circle cx="32" cy="24" r="3.5" fill="url(#filament)" />
    <!-- Orbiting Synapses / Nodes -->
    <circle cx="24" cy="28" r="2" fill="#1daff7" />
    <circle cx="40" cy="28" r="2" fill="#1daff7" />
    <circle cx="26" cy="18" r="1.8" fill="#f6af3c" />
    <circle cx="38" cy="18" r="1.8" fill="#f6af3c" />

    <!-- Connecting Synapse Lines -->
    <path d="M32 24 L24 28 M32 24 L40 28 M32 24 L26 18 M32 24 L38 18 M24 28 L26 18 M40 28 L38 18" 
          stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" stroke-linecap="round" />
    
    <!-- Filament Mount Wires -->
    <path d="M28 41 L28 35 L32 24 L36 35 L36 41" 
          stroke="url(#filament)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Glowing Rays / Sparks -->
  <path d="M32 4 L32 7 M14 13 L16.5 15 M50 13 L47.5 15 M9 25 L12 25 M55 25 L52 25" 
        stroke="#1daff7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
